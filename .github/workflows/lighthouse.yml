name: Lighthouse CI

on:
  deployment_status:

permissions:
  contents: read
  pull-requests: write

jobs:
  lighthouse:
    # Run only for successful Vercel preview/production deployments
    if: github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Lighthouse CI
        id: lhci
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            ${{ github.event.deployment_status.target_url }}
          configPath: './esn-ukraine-web/.lighthouserc.json'
          uploadArtifacts: true 
          temporaryPublicStorage: true 

      - name: Find Associated PR
        id: find-pr
        uses: actions/github-script@v7
        with:
          script: |
            const response = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.payload.deployment.sha
            });
            if (response.data.length > 0) {
              core.setOutput('pr_number', response.data[0].number);
            }

      - name: Post Lighthouse Comment in PR
        if: steps.find-pr.outputs.pr_number
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const links = ${{ steps.lhci.outputs.links }};
            const reportUrl = Object.values(links)[0];
            const prNumber = ${{ steps.find-pr.outputs.pr_number }};
            const targetUrl = '${{ github.event.deployment_status.target_url }}';
            
            const comment = `### ⚡ Lighthouse CI Report
            
            The performance audit has completed successfully against the Vercel Preview.
            
            🔗 **[View Detailed Lighthouse Report](${reportUrl})**
            
            > **Tested URL:** ${targetUrl}
            > **Note:** This report is stored in temporary public storage and will expire in a few days.`;
            
            await github.rest.issues.createComment({
              issue_number: prNumber,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
